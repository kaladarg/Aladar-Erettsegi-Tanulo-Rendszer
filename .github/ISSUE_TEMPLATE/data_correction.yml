name: Data correction (hibás feladat / megoldás)
description: Report a wrong task, answer key, score or field position in an exam.
labels: [data-correction]
body:
  - type: input
    id: exam
    attributes:
      label: Exam id
      description: Shown in the app, e.g. matematika-kozep-2024-majus.
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task number / id
      placeholder: e.g. I-3a
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - Answer key / accepted answers
        - Points or partial credit
        - Task text or source text
        - Answer field position on the PDF
        - Explanation
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong and what is correct? Cite the page of the official javítási-értékelési útmutató if you can.
    validations:
      required: true
